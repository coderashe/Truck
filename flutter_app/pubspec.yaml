name: truckflow
description: Complete haulage and trucking business operations manager built with Flutter and Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase (Serverless Backend + Offline Persistence)
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.3.7
  google_sign_in: ^6.2.2

  # Maps, Location & HTTP
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  http: ^1.2.2

  # UI, Typography, Motion & Charts
  google_fonts: ^6.2.1
  fl_chart: ^0.70.0
  flutter_animate: ^4.5.2

  # PDF Generation, Printing & Sharing
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.3

  # Device Utilities
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
